# CI de Material: lint, tests unitarios y de integración con coverage mínimo de
# 60%, y build de la imagen Docker.
name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    # Los tests de integración usan el Mongo y el Kafka del docker-compose, en
    # los mismos puertos (27018 y 9192), así que no necesitan variables.
    services:
      mongo:
        image: mongo:7
        ports:
          - 27018:27017

      kafka:
        image: apache/kafka:3.9.1
        ports:
          - 9192:9192
        # La misma configuración que docker-compose.yml.
        env:
          KAFKA_NODE_ID: 1
          KAFKA_PROCESS_ROLES: broker,controller
          KAFKA_LISTENERS: PLAINTEXT://:9192,CONTROLLER://:9093
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9192
          KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
          KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
          KAFKA_OFFSETS_TOPIC_NUM_PARTITIONS: 1
          KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

    steps:
      # El servicio y sus tests leen los .proto del submódulo contracts/.
      - uses: actions/checkout@v5
        with:
          submodules: true

      # La misma versión que la imagen (node:24-alpine).
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Compilar
        run: npm run build

      # Unitarios e integración juntos. Falla si alguna métrica queda bajo el
      # umbral de 60% de jest.config.ts.
      - name: Tests y coverage
        run: npm run test:cov

      - name: Informe de coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/

      # Solo comprueba que la imagen se construye; todavía no se publica.
      - name: Imagen Docker
        run: docker build -t tutormatch-material:${{ github.sha }} .
